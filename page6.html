<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旗津水域安全小達人測驗</title>
    <style>
        :root {
            --primary-blue: #0288d1;
            --dark-blue: #01579b;
            --danger-red: #d32f2f;
            --safe-green: #388e3c;
            --bg-color: #e1f5fe;
            --card-bg: #ffffff;
            --text-color: #212121;
        }

        * {
            box-sizing: border-box;
            font-family: "Microsoft JhengHei", "微軟正黑體", sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            color: var(--text-color);
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 650px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            padding: 25px;
            border: 5px solid var(--primary-blue);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: #b3e5fc;
            padding: 12px 20px;
            border-radius: 15px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .question-card {
            background-color: #f9f9f9;
            border-left: 8px solid var(--primary-blue);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .question-title {
            font-size: 1.4rem;
            line-height: 1.6;
            font-weight: bold;
            color: #0d47a1;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option-btn {
            background-color: #ffffff;
            border: 3px solid #b0bec5;
            border-radius: 16px;
            padding: 16px 20px;
            font-size: 1.2rem;
            font-weight: bold;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-color);
        }

        .option-btn:hover {
            border-color: var(--primary-blue);
            background-color: #e0f7fa;
        }

        .option-btn.correct {
            background-color: #e8f5e9 !important;
            border-color: var(--safe-green) !important;
            color: #1b5e20 !important;
        }

        .option-btn.wrong {
            background-color: #ffebee !important;
            border-color: var(--danger-red) !important;
            color: #c62828 !important;
        }

        .feedback-box {
            margin-top: 20px;
            padding: 20px;
            border-radius: 15px;
            font-size: 1.2rem;
            line-height: 1.6;
            display: none;
        }

        .feedback-box.correct-bg {
            background-color: #e8f5e9;
            border: 3px solid var(--safe-green);
            color: #1b5e20;
        }

        .feedback-box.wrong-bg {
            background-color: #ffebee;
            border: 3px solid var(--danger-red);
            color: #c62828;
        }

        .btn-next {
            background-color: var(--primary-blue);
            color: white;
            border: none;
            border-radius: 25px;
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            display: block;
            margin: 15px 0 0 auto;
        }

        .hide { display: none !important; }
        .card-center { text-align: center; padding: 20px 10px; }
        .main-title { font-size: 2.2rem; color: var(--dark-blue); margin-bottom: 15px; }
        .desc-text { font-size: 1.3rem; line-height: 1.6; color: #37474f; margin-bottom: 25px; }
        
        .big-btn {
            background-color: var(--primary-blue);
            color: white;
            border: none;
            border-radius: 30px;
            padding: 16px 45px;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .score-display { font-size: 4rem; font-weight: bold; color: var(--primary-blue); margin: 15px 0; }
    </style>
</head>
<body>

    <div class="container">
        <!-- 開始畫面 -->
        <div id="start-screen" class="card-center">
            <h1 class="main-title">🌊 旗津水域安全大挑戰</h1>
            <p class="desc-text">
                你是聰明的「旗津安全出遊者」嗎？<br>
                遇到颱風大浪，你知道該怎麼保護自己嗎？<br>
                快點按下方按鈕開始挑戰吧！
            </p>
            <button class="big-btn" onclick="startQuiz()">開始挑戰 🚀</button>
        </div>

        <!-- 測驗畫面 -->
        <div id="quiz-screen" class="hide">
            <div class="top-bar">
                <span id="question-progress">第 1 / 5 題</span>
                <span>💪 聰明小勇士</span>
            </div>

            <div class="question-card">
                <div id="question-text" class="question-title"></div>
            </div>

            <div id="options-container" class="options-list"></div>

            <div id="feedback-box" class="feedback-box">
                <div id="feedback-title" style="font-weight: bold; font-size: 1.3rem; margin-bottom: 8px;"></div>
                <div id="feedback-detail"></div>
                <button id="next-btn" class="btn-next" onclick="nextQuestion()">下一題 ➔</button>
            </div>
        </div>

        <!-- 結算畫面 -->
        <div id="result-screen" class="card-center hide">
            <h2 style="color: var(--dark-blue); font-size: 2.2rem;">挑戰完成！</h2>
            <div id="score-text" class="score-display">100 分</div>
            <p id="result-msg" class="desc-text"></p>
            <button class="big-btn" onclick="location.reload()">再玩一次 🔄</button>
        </div>
    </div>

    <script>
        const quizData = [
            {
                question: "1. 🚨 颱風天看到螢幕上的 GoOcean 亮「大紅燈」，代表什麼意思？",
                options: [
                    "A. 海邊非常危險！絕對不可以去！",
                    "B. 浪很大很好玩，快點去跑跑",
                    "C. 海水很涼快，可以去游泳"
                ],
                correct: 0,
                explanation: "記得喔！亮大紅燈代表海邊超級危險，暴風和巨浪會把人捲走，絕對不能靠近！"
            },
            {
                question: "2. 🗣️ 壞朋友拉你說：「颱風天去旗津看大浪抓魚啦！」這時候你要怎麼做？",
                options: [
                    "A. 聽朋友的話，一起跑去海邊",
                    "B. 踩緊線內、手比叉叉，大喊：「不可以！颱風天亮紅燈！危險我不去！」",
                    "C. 偷偷跟著去，不告訴爸爸媽媽"
                ],
                correct: 1,
                explanation: "太棒了！我們要勇敢拒絕壞誘惑，踩緊安全線內，手比叉叉大聲說不可以！"
            },
            {
                question: "3. 🌊 如果看到有人在海裡掉下去掙扎，我們可以直接跳進水裡救他嗎？",
                options: [
                    "A. 可以，立刻跳進海裡救人",
                    "B. 不可以！要死守安全藍線內，絕對不跳水！",
                    "C. 找朋友一起跳進水裡"
                ],
                correct: 1,
                explanation: "沒錯！岸上救援第一原則：絕對不衝動跳水！要乖乖站穩在安全藍線裡面。"
            },
            {
                question: "4. 📞 看到有人落水，救援口訣「叫、叫、伸、拋、划」，第一個「叫」要怎麼做？",
                options: [
                    "A. 大聲大喊「有人落水了！」並打電話 118 或 119 求救",
                    "B. 坐在地上一直哭",
                    "C. 拿出手機拍照上傳"
                ],
                correct: 0,
                explanation: "對！要大聲叫人幫忙，並且馬上打電話給 118 或 119 找救援隊！"
            },
            {
                question: "5. 🧹 站在岸上要救落水的人，我們可以用什麼東西伸過去或拋過去幫他？",
                options: [
                    "A. 伸出自己的腳讓他抓",
                    "B. 伸出長掃把，或是拋出綁著繩子的寶特瓶",
                    "C. 拿小石頭丟他"
                ],
                correct: 1,
                explanation: "答對了！可以用長掃把讓他抓，或是丟綁繩子的寶特瓶，絕對不能用手腳直接拉喔！"
            }
        ];

        let currentQuestion = 0;
        let score = 0;

        const startScreen = document.getElementById('start-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        const optionsContainer = document.getElementById('options-container');
        const feedbackBox = document.getElementById('feedback-box');

        function startQuiz() {
            startScreen.classList.add('hide');
            quizScreen.classList.remove('hide');
            currentQuestion = 0;
            score = 0;
            loadQuestion();
        }

        function loadQuestion() {
            feedbackBox.style.display = 'none';
            optionsContainer.innerHTML = '';

            const data = quizData[currentQuestion];
            document.getElementById('question-progress').innerText = `第 ${currentQuestion + 1} / ${quizData.length} 題`;
            document.getElementById('question-text').innerText = data.question;

            data.options.forEach((optText, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = optText;
                btn.onclick = () => selectOption(index);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(selectedIndex) {
            const data = quizData[currentQuestion];
            const buttons = optionsContainer.querySelectorAll('.option-btn');
            buttons.forEach(btn => btn.style.pointerEvents = 'none');

            if (selectedIndex === data.correct) {
                score += 20;
                buttons[selectedIndex].classList.add('correct');
                feedbackBox.className = 'feedback-box correct-bg';
                document.getElementById('feedback-title').innerText = "⭕ 太棒了！答對囉！";
            } else {
                buttons[selectedIndex].classList.add('wrong');
                buttons[data.correct].classList.add('correct');
                feedbackBox.className = 'feedback-box wrong-bg';
                document.getElementById('feedback-title').innerText = "❌ 差一點點！再記一下喔：";
            }
            
            document.getElementById('feedback-detail').innerText = data.explanation;
            feedbackBox.style.display = 'block';
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < quizData.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            quizScreen.classList.add('hide');
            resultScreen.classList.remove('hide');
            document.getElementById('score-text').innerText = `${score} 分`;
            
            const msgEl = document.getElementById('result-msg');
            if (score === 100) {
                msgEl.innerHTML = "好厲害！你是<b>【旗津海邊安全小超人】</b>！💯<br>你懂得保護自己，颱風天絕對不去海邊危險的地方！";
            } else if (score >= 60) {
                msgEl.innerHTML = "很不錯喔！你是<b>【安全守護小幫手】</b>！👍<br>記得颱風天亮紅燈不可以去海邊，救人不可以跳水喔！";
            } else {
                msgEl.innerHTML = "沒關係，我們再練習一次！💪<br>記得：颱風天不看海、不跳水，安全第一名！";
            }
        }
    </script>
</body>
</html>
